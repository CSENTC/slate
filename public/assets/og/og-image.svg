<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Slate – Timetables, solved.">
  <!-- Cream background -->
  <rect width="1200" height="630" fill="#F4F2EC"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DFD5" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Mark (140px tall = 140/96 * 96 = 140px square) centred at (600, 230) -->
  <g transform="translate(454, 100) scale(1.458)">
    <rect width="96" height="96" rx="22" fill="#FF5A1F"/>
    <rect x="12" y="12" width="20" height="20" rx="4" fill="#F4F2EC"/>
    <rect x="38" y="12" width="20" height="20" rx="4" fill="#F4F2EC"/>
    <rect x="64" y="12" width="20" height="20" rx="4" fill="#F4F2EC"/>
    <rect x="12" y="38" width="20" height="20" rx="4" fill="#F4F2EC"/>
    <rect x="38" y="38" width="20" height="20" rx="4" fill="#121210"/>
    <rect x="64" y="38" width="20" height="20" rx="4" fill="#F4F2EC"/>
    <rect x="12" y="64" width="20" height="20" rx="4" fill="#F4F2EC"/>
    <rect x="38" y="64" width="20" height="20" rx="4" fill="#F4F2EC"/>
    <rect x="64" y="64" width="20" height="20" rx="4" fill="#F4F2EC"/>
  </g>

  <!-- Wordmark "Slate." at ~140px height, centred -->
  <text
    x="600" y="380"
    font-family="'Inter Tight', Inter, system-ui, sans-serif"
    font-weight="800"
    font-size="130"
    letter-spacing="-6"
    text-anchor="middle"
    fill="#121210">Slate</text>
  <text
    x="833" y="380"
    font-family="'Inter Tight', Inter, system-ui, sans-serif"
    font-weight="800"
    font-size="130"
    text-anchor="middle"
    fill="#FF5A1F">.</text>

  <!-- Tagline -->
  <text
    x="600" y="455"
    font-family="'Inter Tight', Inter, system-ui, sans-serif"
    font-weight="800"
    font-size="32"
    letter-spacing="0"
    text-anchor="middle"
    fill="#121210">Timetables, </text>
  <text
    x="820" y="455"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="400"
    font-size="32"
    text-anchor="middle"
    fill="#FF5A1F">solved.</text>
</svg>

